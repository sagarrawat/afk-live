name: Deploy stream worker

# Manual on purpose: deploy the worker only when streaming code changed.
#
# OPS-3: by default the new version starts next to the running one and live streams are handed over
# one at a time, without interruption (afklive-scripts/worker-handover-deploy.sh; one-time server setup
# in docs/operations.md, "Worker deploys without interruption"). "restart" is the old way: the worker
# restarts and every stream drops for about 30-90 s; use it for the first deploy of the handover itself,
# or if the handover can't run (the script says so, and changes nothing).
#
# FO-8: "hosts" picks where. The default (main) is the main server only, as before. "main+extra" then deploys
# the extra worker hosts listed in the WORKER_HOSTS secret (remote pools, e.g. Oracle or Hetzner), one at a
# time, with the same handover on each (afklive-scripts/deploy-worker-hosts.sh); "extra" deploys only those.
# Setup: docs/operations.md, "Worker pools".
on:
  workflow_dispatch:
    inputs:
      method:
        description: 'handover = streams keep running (default); restart = old way, streams drop for ~30-90 s'
        type: choice
        options:
          - handover
          - restart
        default: handover
      hosts:
        description: 'main = the main server only (default); main+extra = then each host in WORKER_HOSTS, one at a time; extra = only those'
        type: choice
        options:
          - main
          - main+extra
          - extra
        default: main
      ref:
        description: 'Commit SHA, tag or branch to deploy (empty = the branch chosen above, normally main)'
        type: string
        required: false
        default: ''

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    # Never at the same time as a web deploy (OPS-4): both may start a second JVM. Waits for the other.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Show what is being deployed
        run: git log -1 --format='Deploying %H (%s)'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && mvn -B verify -pl afklive-web -am -DskipUi -DskipUiTests  # workers don't serve the app UI

      - name: Copy JAR to the worker (handover)
        if: ${{ inputs.method != 'restart' && inputs.hosts != 'extra' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "afklive-web/target/app.jar"
          target: "/opt/afklive/worker/incoming/"
          strip_components: 2

      - name: Hand streams over to the new version
        if: ${{ inputs.method != 'restart' && inputs.hosts != 'extra' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            if [ ! -x /opt/afklive/scripts/worker-handover-deploy.sh ]; then
              echo "The handover isn't set up on this server yet (docs/operations.md). Nothing was changed; deploy with method=restart."
              exit 1
            fi
            sudo /opt/afklive/scripts/worker-handover-deploy.sh /opt/afklive/worker/incoming/app.jar

      - name: Copy JAR to the worker (restart)
        if: ${{ inputs.method == 'restart' && inputs.hosts != 'extra' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "afklive-web/target/app.jar"
          target: "/opt/afklive/worker/"
          strip_components: 2

      - name: Restart worker
        if: ${{ inputs.method == 'restart' && inputs.hosts != 'extra' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            if [ -x /opt/afklive/scripts/worker-handover-deploy.sh ]; then
              # Restarts whichever slot runs (or the single legacy unit) with the new jar.
              sudo /opt/afklive/scripts/worker-handover-deploy.sh --restart /opt/afklive/worker/app.jar
            else
              sudo systemctl restart afklive-worker
            fi

      # FO-8: opt-in. Runs only when asked (hosts = main+extra or extra), after the main server, one host at a
      # time; the first failure stops the rest. Secrets: WORKER_HOSTS ([user@]host[:port], separated by spaces,
      # commas or new lines), WORKER_HOSTS_KNOWN_HOSTS (their pinned host keys), WORKER_HOSTS_SSH_KEY (empty:
      # DO_SSH_KEY), WORKER_HOSTS_USER (empty: deploy).
      - name: Deploy the extra worker hosts
        if: ${{ inputs.hosts == 'main+extra' || inputs.hosts == 'extra' }}
        env:
          WORKER_HOSTS: ${{ secrets.WORKER_HOSTS }}
          WORKER_HOSTS_USER: ${{ secrets.WORKER_HOSTS_USER }}
          KNOWN_HOSTS: ${{ secrets.WORKER_HOSTS_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.WORKER_HOSTS_SSH_KEY || secrets.DO_SSH_KEY }}
          METHOD: ${{ inputs.method }}
        run: |
          if [ "$METHOD" = restart ]; then
            bash afklive-scripts/deploy-worker-hosts.sh --restart afklive-web/target/app.jar
          else
            bash afklive-scripts/deploy-worker-hosts.sh afklive-web/target/app.jar
          fi
