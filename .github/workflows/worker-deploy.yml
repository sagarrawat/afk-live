name: Deploy stream worker

# Manual on purpose: deploy the worker only when streaming code changed.
#
# OPS-3: by default the new version starts next to the running one and live streams are handed over
# one at a time, without interruption (afklive-scripts/worker-handover-deploy.sh; one-time server setup
# in docs/operations.md, "Worker deploys without interruption"). "restart" is the old way: the worker
# restarts and every stream drops for about 30-90 s; use it for the first deploy of the handover itself,
# or if the handover can't run (the script says so, and changes nothing).
#
# Upload: only what changed in app.jar since the jar already in the target folder is sent
# (afklive-scripts/upload-jar.sh, rsync over ssh; about 2 MB instead of ~110 MB). If that can't run, the whole
# jar is copied the old way; "full" forces that.
on:
  workflow_dispatch:
    inputs:
      method:
        description: 'handover = streams keep running (default); restart = old way, streams drop for ~30-90 s'
        type: choice
        options:
          - handover
          - restart
        default: handover
      ref:
        description: 'Commit SHA, tag or branch to deploy (empty = the branch chosen above, normally main)'
        type: string
        required: false
        default: ''
      upload:
        description: 'delta = send only what changed in the jar (default, about 2 MB); full = copy the whole jar the old way (about 110 MB)'
        type: choice
        options:
          - delta
          - full
        default: delta

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    # Never at the same time as a web deploy (OPS-4): both may start a second JVM. Waits for the other.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Show what is being deployed
        run: git log -1 --format='Deploying %H (%s)'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && mvn -B verify -pl afklive-web -am -DskipUi -DskipUiTests  # workers don't serve the app UI

      # The jar left in incoming/ by the previous handover is the basis for the delta.
      - name: Upload JAR to the worker (handover, only what changed)
        id: delta_handover
        if: ${{ inputs.method != 'restart' && inputs.upload != 'full' }}
        continue-on-error: true
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: bash afklive-scripts/upload-jar.sh afklive-web/target/app.jar /opt/afklive/worker/incoming/app.jar

      - name: Copy JAR to the worker (handover, whole jar)
        if: ${{ inputs.method != 'restart' && (inputs.upload == 'full' || steps.delta_handover.outcome == 'failure') }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "afklive-web/target/app.jar"
          target: "/opt/afklive/worker/incoming/"
          strip_components: 2

      - name: Hand streams over to the new version
        if: ${{ inputs.method != 'restart' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            if [ ! -x /opt/afklive/scripts/worker-handover-deploy.sh ]; then
              echo "The handover isn't set up on this server yet (docs/operations.md). Nothing was changed; deploy with method=restart."
              exit 1
            fi
            sudo /opt/afklive/scripts/worker-handover-deploy.sh /opt/afklive/worker/incoming/app.jar

      # The new jar is renamed into place: a running legacy worker keeps its open file until it restarts.
      - name: Upload JAR to the worker (restart, only what changed)
        id: delta_restart
        if: ${{ inputs.method == 'restart' && inputs.upload != 'full' }}
        continue-on-error: true
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: bash afklive-scripts/upload-jar.sh afklive-web/target/app.jar /opt/afklive/worker/app.jar

      - name: Copy JAR to the worker (restart, whole jar)
        if: ${{ inputs.method == 'restart' && (inputs.upload == 'full' || steps.delta_restart.outcome == 'failure') }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "afklive-web/target/app.jar"
          target: "/opt/afklive/worker/"
          strip_components: 2

      - name: Restart worker
        if: ${{ inputs.method == 'restart' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            if [ -x /opt/afklive/scripts/worker-handover-deploy.sh ]; then
              # Restarts whichever slot runs (or the single legacy unit) with the new jar.
              sudo /opt/afklive/scripts/worker-handover-deploy.sh --restart /opt/afklive/worker/app.jar
            else
              sudo systemctl restart afklive-worker
            fi
