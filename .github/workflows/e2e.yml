name: End-to-end test

# The browser end-to-end test of the creator journey (afklive-scripts/e2e.sh; docs/operations.md,
# "End-to-end test"). Manual only: run it before a release or after a change to a main screen. It starts the
# whole app on the runner with a local RTMP sink and a payment test double; nothing reaches YouTube or PhonePe.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 22 (builds the React app into the jar)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afklive-ui/package-lock.json

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Same version as playwright.version in afklive-web/pom.xml: each Playwright drives its own Chromium build.
      - name: Install Chromium for Playwright
        run: npx -y playwright@1.56.0 install --with-deps chromium

      - name: Run the end-to-end test
        run: afklive-scripts/e2e.sh

      - name: Upload screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            afklive-web/target/e2e/
            afklive-web/target/surefire-reports/
          retention-days: 14
