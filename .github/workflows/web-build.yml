name: Afklive-web CI & CD

# Deploys the web app on every push to main.
#
# OPS-4: by default the new version starts next to the running one and takes over when it is ready, so
# nobody sees an error (afklive-scripts/web-deploy.sh; one-time server setup in docs/operations.md, "Web
# deploys without downtime"). Until that setup is done on the server, this falls back to the old restart.
# "restart" (manual runs only) is the old way on purpose: the web app restarts and the site answers with
# errors for about a minute; use it if the script refuses (it says why and changes nothing).
on:
  push:
    branches: [ main ]
    paths:
      - 'afklive-web/**'
      - 'afklive-ui/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      method:
        description: 'zero-downtime = start the new version next to the old one (default); restart = old way, about a minute of errors'
        type: choice
        options:
          - zero-downtime
          - restart
        default: zero-downtime

jobs:
  # JOB 1: Deploy Web App to DigitalOcean
  deploy-web:
    runs-on: ubuntu-latest
    # One deploy on the server at a time, web or worker: each starts a second JVM for a while, and both at
    # once may not fit in memory (docs/operations.md). A run waits for the other to finish; while one runs,
    # a newer queued run replaces an older queued one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history: the site build dates each page in /sitemap.xml (lastmod) from git.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 22 (builds the React app into the jar)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afklive-ui/package-lock.json

      # Build ONLY the web module (saves time); this also builds afklive-ui into it
      # Tests ran on the pull request (PR checks, with FFmpeg); here we only build what we ship.
      - name: Build Web Module
        run: mvn -B clean package -pl afklive-web -am -DskipTests -DskipUiTests

      # Next to, never over, the jar the running web app uses.
      - name: Copy JAR to DigitalOcean VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "afklive-web/target/app.jar"
          target: "/opt/afklive/incoming/web/"
          strip_components: 2

      # The "AFK Live is updating" page Caddy shows while the web app restarts (afklive-scripts/caddy/errors,
      # docs/operations.md, "While the web app restarts"). Uploaded before the deploy so it's in place when the
      # old version stops. Until the one-time server setup is done this upload fails, and that never stops the
      # deploy (the next step only warns).
      - name: Copy updating page to DigitalOcean VM
        continue-on-error: true
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "afklive-scripts/caddy/errors/index.html"
          target: "/opt/afklive/incoming/errors/"
          strip_components: 3

      # Swapped in with one rename, so Caddy never serves a half-written page.
      - name: Publish updating page
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            SRC=/opt/afklive/incoming/errors/index.html
            DIR=/opt/afklive/errors
            if [ -f "$SRC" ] && [ -d "$DIR" ] && [ -w "$DIR" ]; then
              install -m 0644 "$SRC" "$DIR/index.html.new" && mv -f "$DIR/index.html.new" "$DIR/index.html" && echo "Updating page published to $DIR/index.html"
            else
              echo "::warning::The 'updating' page isn't set up on this server yet (docs/operations.md, 'While the web app restarts'); visitors see the browser's 502 page during a restart."
            fi
            exit 0

      # OPS-7: integration secrets live in GitHub (Settings → Secrets and variables → Actions) and are written
      # into /opt/afklive/afklive.env before the new version starts. A secret not set in GitHub is skipped, so
      # the server's own value stays. Values go over stdin and are never printed. Until the one-time server
      # setup is done (docs/operations.md, "Secrets from GitHub") this step only warns; the deploy goes on.
      - name: Sync secrets
        uses: appleboy/ssh-action@v1.2.5
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_YOUTUBE_CLIENT_ID: ${{ secrets.GOOGLE_YOUTUBE_CLIENT_ID }}
          GOOGLE_YOUTUBE_CLIENT_SECRET: ${{ secrets.GOOGLE_YOUTUBE_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_PUSH_VAPID_KEY: ${{ secrets.APP_PUSH_VAPID_KEY }}
          APP_TURNSTILE_SITE_KEY: ${{ secrets.APP_TURNSTILE_SITE_KEY }}
          APP_TURNSTILE_SECRET: ${{ secrets.APP_TURNSTILE_SECRET }}
          PHONEPE_CLIENT_ID: ${{ secrets.PHONEPE_CLIENT_ID }}
          PHONEPE_CLIENT_SECRET: ${{ secrets.PHONEPE_CLIENT_SECRET }}
          PHONEPE_CLIENT_VERSION: ${{ secrets.PHONEPE_CLIENT_VERSION }}
          PHONEPE_CALLBACK_PASSWORD: ${{ secrets.PHONEPE_CALLBACK_PASSWORD }}
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_YOUTUBE_CLIENT_ID,GOOGLE_YOUTUBE_CLIENT_SECRET,ANTHROPIC_API_KEY,APP_PUSH_VAPID_KEY,APP_TURNSTILE_SITE_KEY,APP_TURNSTILE_SECRET,PHONEPE_CLIENT_ID,PHONEPE_CLIENT_SECRET,PHONEPE_CLIENT_VERSION,PHONEPE_CALLBACK_PASSWORD,ZEPTOMAIL_TOKEN,STORAGE_ACCESS_KEY,STORAGE_SECRET_KEY
          script: |
            set -e
            if [ ! -x /opt/afklive/scripts/sync-secrets.sh ]; then
              echo "::warning::Secrets from GitHub aren't set up on this server yet (docs/operations.md, 'Secrets from GitHub'); the server's afklive.env is used as it is."
              exit 0
            fi
            for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_YOUTUBE_CLIENT_ID GOOGLE_YOUTUBE_CLIENT_SECRET ANTHROPIC_API_KEY APP_PUSH_VAPID_KEY APP_TURNSTILE_SITE_KEY APP_TURNSTILE_SECRET PHONEPE_CLIENT_ID PHONEPE_CLIENT_SECRET PHONEPE_CLIENT_VERSION PHONEPE_CALLBACK_PASSWORD ZEPTOMAIL_TOKEN STORAGE_ACCESS_KEY STORAGE_SECRET_KEY; do
              eval "v=\${$k:-}"
              [ -n "$v" ] && printf '%s=%s\n' "$k" "$v"
            done | sudo /opt/afklive/scripts/sync-secrets.sh

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          METHOD: ${{ inputs.method || 'zero-downtime' }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: METHOD
          command_timeout: 15m
          script: |
            set -e
            JAR=/opt/afklive/incoming/web/app.jar
            if [ -x /opt/afklive/scripts/web-deploy.sh ]; then
              if [ "$METHOD" = restart ]; then
                sudo /opt/afklive/scripts/web-deploy.sh --restart "$JAR"
              else
                sudo /opt/afklive/scripts/web-deploy.sh "$JAR"
              fi
            else
              echo "Zero-downtime deploys aren't set up on this server yet (docs/operations.md); restarting the old way (about a minute of errors)."
              install -m 0644 "$JAR" /opt/afklive/app.jar.new
              mv -f /opt/afklive/app.jar.new /opt/afklive/app.jar
              sudo systemctl restart afklive
            fi
