# Local development profile: run with SPRING_PROFILES_ACTIVE=dev
# Needs only a local PostgreSQL (see docker-compose.dev.yml at the repo root) and ffmpeg on PATH.
# No Google, payment, AI or cloud-storage secrets are required.
spring:
  liquibase:
    contexts: dev
  thymeleaf:
    cache: false

app:
  storage:
    type: local
  # Development only: a fixed key so local data stays readable across restarts. Never use in production.
  encryption-key: ZGV2LWtleS1kZXYta2V5LWRldi1rZXktZGV2LWtleSE=
  ingest:
    public-host: localhost
    read-pass: dev-read-pass
    auth-secret: dev-auth-secret

logging:
  level:
    com.afklive: DEBUG

server:
  error:
    include-message: always
