<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${(heading != null ? heading : 'Something went wrong.') + ' AFK Live'}">Something went wrong. AFK Live</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/site/site.css">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/site/brand/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#10122A">
</head>
<body class="night flex min-h-screen flex-col">
<header class="mx-auto flex w-full max-w-6xl items-center px-4 py-5 sm:px-6">
    <a href="/"><img src="/site/brand/logo-on-dark.svg" alt="AFK Live" width="111" height="30" class="h-[30px] w-auto"></a>
</header>
<main class="mx-auto flex w-full max-w-6xl flex-1 flex-col items-start justify-center px-4 pb-24 sm:px-6">
    <img src="/site/brand/mark.svg" alt="" width="96" height="96" class="h-24 w-24 opacity-90">
    <!--/* OPS-2: ErrorPageAttributes words every status; only a server error (5xx) blames us. */-->
    <h1 class="mt-8 text-[44px] font-extrabold leading-none tracking-[-0.035em] sm:text-[64px]" th:text="${heading != null ? heading : 'Something went wrong.'}">Something went wrong.</h1>
    <p class="mt-5 max-w-lg text-lg text-muted" th:text="${explanation != null ? explanation : 'Go back and try again.'}">Go back and try again.</p>
    <p th:if="${requestId}" class="mt-3 text-sm text-muted">Code: <span class="font-mono" th:text="${requestId}">abcd2345</span></p>
    <div class="mt-8 flex flex-wrap gap-3">
        <a href="/" class="btn-primary h-12 px-7">Go to the homepage</a>
        <a href="/studio" class="btn-secondary h-12 px-7">Open your streams</a>
    </div>
</main>
</body>
</html>
