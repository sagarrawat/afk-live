<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password: AFK Live</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/site/assets/site.css">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/site/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/site/brand/apple-touch-icon.png">
    <meta name="theme-color" content="#10122A">
</head>
<body class="min-h-screen lg:grid lg:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)]">
<aside class="night hidden flex-col justify-between p-12 lg:flex">
    <a href="/"><img src="/site/brand/logo-on-dark.svg" alt="AFK Live" width="111" height="30" class="h-[30px] w-auto"></a>
    <div>
        <img src="/site/brand/mark.svg" alt="" width="120" height="120" class="h-28 w-28">
        <p class="display mt-8 max-w-sm text-[44px] font-extrabold leading-[1.02] tracking-[-0.03em]">Go to sleep. Stay live.</p>
        <p class="mt-4 max-w-sm text-lg text-muted">Your playlist keeps playing and your phone stream survives bad signal, while you're away.</p>
    </div>
    <p class="text-sm text-muted">Made in India for creators everywhere.</p>
</aside>
<main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-4 py-10 sm:px-6 lg:justify-center">
    <a href="/" class="lg:hidden"><img src="/site/brand/logo-on-light.svg" alt="AFK Live" width="111" height="30" class="h-[30px] w-auto"></a>
    <div class="mt-12 rounded-2xl border border-line bg-panel p-6 shadow-[0_24px_48px_-32px_rgba(16,18,42,0.35)] sm:p-8 lg:mt-0">
        <h1 class="display text-[28px] font-extrabold tracking-[-0.02em]">Choose a new password</h1>
        <form th:action="@{/reset-password}" method="post" class="mt-6 space-y-4">
            <input type="hidden" name="token" th:value="${token}">
            <p th:if="${param.expired}" class="note-bad" role="alert">This page expired. Please try again.</p>
            <p th:if="${error}" class="note-bad" role="alert" th:text="${error}"></p>
            <div>
                <label for="password" class="label">New password</label>
                <input id="password" type="password" name="password" required autocomplete="new-password" class="field">
            </div>
            <div>
                <label for="confirm" class="label">Type it again</label>
                <input id="confirm" type="password" name="confirmPassword" required autocomplete="new-password" class="field">
            </div>
            <button type="submit" class="btn-primary w-full">Save new password</button>
        </form>
    </div>
    <p class="mt-auto pt-10 text-center lg:mt-10 text-sm text-muted"><a href="/terms" class="hover:text-ink">Terms</a> &nbsp; <a href="/privacy" class="hover:text-ink">Privacy</a> &nbsp; <a href="mailto:support@afklive.in" class="hover:text-ink">Help</a></p>
</main>

</body>
</html>
