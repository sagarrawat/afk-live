<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in: AFK Live</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/site/assets/site.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121722'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f04438'/%3E%3C/svg%3E">
</head>
<body class="min-h-screen">
<main class="mx-auto flex min-h-screen max-w-md flex-col px-4 py-10 sm:px-6">
    <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
        <span aria-hidden="true" class="grid h-7 w-7 place-items-center rounded bg-[#121722]"><span class="h-2.5 w-2.5 rounded-full bg-live"></span></span>
        AFK Live
    </a>
    <div class="mt-12 rounded-lg border border-line bg-panel p-6 sm:p-8">
        <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
        <p class="mt-1 text-muted">Welcome back. Your streams are where you left them.</p>
        <div class="mt-6">
        <a href="/oauth2/authorization/google" class="btn-secondary w-full">
            <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Continue with Google
        </a>
        <div class="my-6 flex items-center gap-3 text-sm text-muted"><span class="h-px flex-1 bg-line"></span>or with email<span class="h-px flex-1 bg-line"></span></div>
        </div>
        <form th:action="@{/login}" method="post" class="space-y-4">
            <p th:if="${param.error}" class="note-bad" role="alert">That email and password don't match. Try again, or reset your password.</p>
            <p th:if="${param.logout}" class="note-ok">You're signed out.</p>
            <p th:if="${success}" class="note-ok" th:text="${success}"></p>
            <div>
                <label for="email" class="label">Email</label>
                <input id="email" type="email" name="username" required autocomplete="email" class="field">
            </div>
            <div>
                <div class="flex items-baseline justify-between">
                    <label for="password" class="label">Password</label>
                    <a href="/forgot-password" class="link text-sm">Forgot it?</a>
                </div>
                <input id="password" type="password" name="password" required autocomplete="current-password" class="field">
            </div>
            <label class="flex items-center gap-2 text-sm">
                <input name="remember-me" type="checkbox" checked class="h-4 w-4 accent-[rgb(var(--accent))]"> Keep me signed in
            </label>
            <button type="submit" class="btn-primary w-full">Sign in</button>
        </form>
        <p class="mt-6 text-center text-sm text-muted">New to AFK Live? <a href="/register" class="link font-medium">Create a free account</a></p>
    </div>
    <p class="mt-auto pt-10 text-center text-sm text-muted"><a href="/terms" class="hover:text-ink">Terms</a> &nbsp; <a href="/privacy" class="hover:text-ink">Privacy</a> &nbsp; <a href="mailto:support@afklive.in" class="hover:text-ink">Help</a></p>
</main>

</body>
</html>
