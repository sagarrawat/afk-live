groups:
  - name: afk-live-alerts
    rules:
      - alert: HighWorkerCrashRate
        expr: rate(worker_crashes_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High worker crash rate detected"
          description: "More than 0.1 workers are crashing per second on average over the last 5 minutes."

      - alert: DailyBudgetExceeded
        expr: platform_daily_spend_usd > platform_daily_budget_usd
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Daily Platform Budget Exceeded!"
          description: "The platform has spent more than the daily budget cap."

      - alert: StaleStreamJobs
        expr: stream_jobs_stale_count > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Multiple stale stream jobs detected"
          description: "There are more than 5 jobs in LIVE state with no worker heartbeats."

      - alert: HighDroppedFrames
        expr: rate(stream_dropped_frames_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Streams are dropping frames"
          description: "The platform is dropping an abnormal amount of frames, possibly due to CPU exhaustion."

      - alert: WorkerOffline
        expr: up{job="afk-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Worker instance offline"
          description: "A streaming worker node is down."

      - alert: DatabaseConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool near limit"
          description: "Active connections are high, may lead to connection exhaustion."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="afk-backend"} / 1024 / 1024 > 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend JVM Memory High"
          description: "Backend API is using over 1GB of memory."

      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage"
          description: "A node is sustaining over 85% CPU usage."

      - alert: APILatencyHigh
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API Latency Degradation"
          description: "p95 latency is over 2 seconds."

      - alert: APITooManyErrors
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API Error Spike"
          description: "Backend returning 5xx errors at a high rate."

      - alert: StreamFailureSpike
        expr: rate(stream_failures_total[5m]) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Streams failing rapidly"
          description: "Streams are entering FAILED state frequently."

      - alert: NightlyReconciliationFailed
        expr: reconciliation_last_success_timestamp_seconds < (time() - 86400 * 2)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Billing Reconciliation Failed"
          description: "The nightly billing cron script hasn't reported success in 48 hours."

      - alert: FreeDiskSpaceLow
        expr: node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk Space Low"
          description: "Less than 10% disk space left on node."
